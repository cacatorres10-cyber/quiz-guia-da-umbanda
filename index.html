<style>
  :root{
    --bg:#ffffff; --ink:#1a1a1a; --ink-soft:#55555f; --faint:#8e8e99;
    --line:#e6e6e6; --track:#f1f1f4; --surface:#ffffff; --surface2:#f7f7fb;
    --blue:#07b0ed; --blue-d:#0592c4;
    --coral:#e94135; --coral-d:#d12a1f; --coral-soft:rgba(233,65,53,.09);
    --purple-ink:#6d28d9;
    --bluepill-ink:#2563eb;
    --good:#1f9d63; --good-bg:#e8f6ef; --good-line:rgba(31,157,99,.28);
    --gold:#e0a42a;
    --shadow:0 10px 34px -14px rgba(0,0,0,.18);
    --shadow-sm:0 6px 20px -12px rgba(0,0,0,.22);
    --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Nunito",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6; min-height:100vh; -webkit-font-smoothing:antialiased;
    font-size:17px;
  }
  #stage{max-width:520px;margin:0 auto;padding:12px 16px 40px;min-height:100vh;display:flex;flex-direction:column}

  /* ---- topbar ---- */
  #topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(6px);
    margin:-12px -16px 10px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .brand{line-height:1}
  .brand .a{display:block;font-size:13px;letter-spacing:.16em;color:rgba(26,26,26,.7);font-weight:600;text-transform:none}
  .brand .b{display:block;font-size:25px;letter-spacing:.04em;color:var(--blue);font-weight:900}
  .rightgrp{display:flex;align-items:center;gap:8px}
  .musicbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--coral);transition:transform .15s,background .2s;flex-shrink:0;padding:0}
  .musicbtn:hover{transform:scale(1.06);background:var(--coral-soft)}
  .saldo{display:flex;align-items:center;gap:8px;padding:5px 13px 5px 10px;border-radius:999px;
    background:linear-gradient(to right,rgba(147,51,234,.14),rgba(79,70,229,.14));border:1px solid rgba(147,51,234,.28)}
  .saldo .gem{font-size:16px}
  .saldo .stxt{font-size:11px;letter-spacing:.12em;color:var(--purple-ink);text-transform:uppercase;line-height:1.1;font-weight:800;opacity:.85}
  .saldo .snum{font-size:16px;color:var(--purple-ink);font-weight:900;font-variant-numeric:tabular-nums}
  .prog{height:9px;background:var(--track);border-radius:999px;overflow:hidden}
  .prog > i{display:block;height:100%;width:6%;border-radius:999px;background:linear-gradient(90deg,var(--coral),#ff7a70);transition:width .5s cubic-bezier(.2,.8,.2,1)}

  main#app{flex:1;padding-top:4px}
  .view{animation:rise .4s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---- typography ---- */
  .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);font-weight:800;text-align:center;margin:0 0 10px}
  p{margin:0 0 12px}
  .lead{color:var(--ink);text-align:center;font-size:17px;font-weight:500;line-height:1.55}
  .center{text-align:center}
  .hl{color:var(--coral);font-weight:800}
  .hlv{color:var(--blue);font-weight:800}
  .qtitle{font-size:clamp(24px,6.5vw,30px);line-height:1.25;text-align:center;margin:2px 0 16px;font-weight:800;letter-spacing:-.3px;text-wrap:balance;color:var(--ink)}
  /* bloco de destaque coral e pergunta de segmentação, no padrão do original */
  .lead-hl{color:var(--coral);text-align:center;font-size:18.5px;font-weight:700;line-height:1.45;margin:0 0 14px}
  .mark{background:linear-gradient(180deg,transparent 52%,rgba(233,65,53,.24) 52%);color:var(--coral-d);font-weight:900;padding:0 3px;border-radius:3px}
  .segq{color:var(--coral);text-align:center;font-size:20px;font-weight:700;margin:16px 0 10px}
  .sec-h{font-size:23px;text-align:center;margin:6px 0 6px;font-weight:900;letter-spacing:-.3px;color:var(--ink)}

  .guide{display:flex;align-items:center;gap:9px;justify-content:center;margin:0 auto 14px;width:fit-content;
    padding:6px 15px 6px 6px;border-radius:999px;background:linear-gradient(to right,rgba(59,130,246,.16),rgba(96,165,250,.09));border:1px solid rgba(59,130,246,.22)}
  .guide img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#eef}
  .guide span.g{font-size:15px;color:var(--bluepill-ink);font-weight:800}
  .guide .dot{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}


  /* promessa do presente: precisa saltar da tela, é o gancho da abertura */
  .giftbox{position:relative;text-align:center;margin:16px 0 14px;padding:16px 16px 15px;
    border-radius:16px;border:2px solid rgba(233,65,53,.34);
    background:linear-gradient(135deg,rgba(233,65,53,.10),rgba(224,164,42,.14));
    box-shadow:0 12px 30px -18px rgba(233,65,53,.75)}
  .giftbox .gicon{font-size:26px;line-height:1;display:block;margin-bottom:5px}
  .giftbox p{margin:0;font-size:19px;line-height:1.38;font-weight:800;color:var(--coral-d)}
  .giftbox .mark{background:linear-gradient(180deg,transparent 52%,rgba(233,65,53,.30) 52%);
    color:var(--coral-d);font-weight:900;padding:0 3px;border-radius:3px}
  @media (max-width:380px){ .giftbox p{font-size:17.5px} }

  /* ---- options ---- */
  .opts{display:flex;flex-direction:column;gap:11px;margin:14px 0 8px}
  .opts.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .opts.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent;
    background:linear-gradient(135deg,var(--coral),#ff5b4f);border:2px solid transparent;border-radius:14px;padding:16px 17px;color:#fff;
    font-size:16.5px;font-weight:800;font-family:inherit;box-shadow:0 10px 22px -12px rgba(233,65,53,.7);
    transition:transform .15s,box-shadow .2s,filter .2s}
  .opt:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 14px 26px -12px rgba(233,65,53,.85)}
  .opt:focus-visible{outline:3px solid rgba(233,65,53,.45);outline-offset:2px}
  .opt.sel{filter:brightness(.9);box-shadow:0 0 0 3px rgba(233,65,53,.35),0 8px 18px -12px rgba(233,65,53,.7)}
  .opt .oimg{width:46px;height:46px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#fff;padding:2px}
  .opt .chev{margin-left:auto;color:rgba(255,255,255,.9);flex-shrink:0;transition:transform .15s}
  .opt:hover .chev{transform:translateX(3px);color:#fff}
  .opt.card{flex-direction:column;text-align:center;gap:10px;padding:12px 9px;background:#fff;color:var(--ink);
    border:2.5px solid var(--coral);box-shadow:0 8px 20px -14px rgba(233,65,53,.6)}
  .opt.card:hover{background:#fff;filter:none;transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(233,65,53,.55)}
  .opt.card.sel{background:var(--coral-soft)}
  .opt.card .oimg{width:100%;height:auto;aspect-ratio:1;border-radius:12px;background:transparent;padding:0}
  .opt.card .chev{display:none}
  .opt.card span{font-size:15px;font-weight:800;color:var(--coral);line-height:1.25}

  .qimg-wrap{display:flex;justify-content:center;margin-bottom:8px}
  .qimg{width:100%;max-width:240px;display:block;border-radius:14px}

  /* ---- buttons ---- */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent;border:none;
    border-radius:14px;padding:17px 20px;font-size:17px;font-weight:800;font-family:inherit;text-decoration:none;
    transition:transform .15s,box-shadow .2s,background .2s;line-height:1.25;text-align:center}
  .btn-gold{background:var(--coral);color:#fff;box-shadow:0 12px 26px -12px rgba(233,65,53,.75)}
  .btn-gold:hover{transform:translateY(-2px);background:var(--coral-d)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-weight:700;font-size:15px;padding:13px}
  .btn-ghost:hover{border-color:var(--coral);color:var(--ink)}
  .pulse-cta{animation:cta 2.4s ease-in-out infinite}
  @keyframes cta{0%,100%{transform:none}50%{transform:scale(1.02)}}

  .inp{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;color:var(--ink);font-size:17px;font-family:inherit;font-weight:700;text-align:center;margin:6px 0 14px}
  .inp:focus{outline:none;border-color:var(--coral)}
  .inp::placeholder{color:var(--faint);font-weight:600}

  /* ---- analyzing ---- */
  .analy{display:flex;flex-direction:column;gap:11px;margin:22px 0}
  .astep{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;opacity:.4;transition:opacity .4s;font-size:15.5px;font-weight:700;color:var(--ink);text-align:left}
  .astep.on{opacity:1;box-shadow:var(--shadow-sm)}
  .astep .ic{width:22px;height:22px;flex-shrink:0}
  .spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--coral);border-radius:50%;animation:spin .8s linear infinite;margin:0 3px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .check{color:var(--good)}

  /* ---- result ---- */
  .score-ring{width:172px;height:172px;margin:8px auto 6px;position:relative;display:flex;align-items:center;justify-content:center}
  .score-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .score-ring .num{font-size:46px;font-weight:900;color:var(--coral);font-variant-numeric:tabular-nums}
  .score-lbl{text-align:center;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:800;margin-bottom:2px}
  .tier{text-align:center;font-size:28px;color:var(--ink);margin:6px 0 4px;font-weight:900;letter-spacing:-.3px}
  .mirror{background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--coral);border-radius:0 12px 12px 0;padding:14px 16px;font-size:16px;color:var(--ink-soft);margin:14px 0;font-weight:600;text-align:left}
  .mirror b{color:var(--ink)}
  .charimg{width:116px;display:block;margin:0 auto 8px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:var(--shadow)}
  .card p{font-size:16px;font-weight:600;margin:0}
  .mockup{width:100%;border-radius:14px;display:block;margin:8px 0}

  .videobox{position:relative;width:100%;max-width:290px;margin:10px auto 4px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0c0c14}
  .videobox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .vfacade{position:absolute;inset:0;width:100%;height:100%;padding:0;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#0c0c14}
  .vfacade img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .vfacade .vplay{position:relative;width:64px;height:64px;border-radius:50%;background:rgba(233,65,53,.94);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;padding-left:4px;box-shadow:0 10px 26px rgba(0,0,0,.55);transition:transform .15s}
  .vfacade:hover .vplay{transform:scale(1.08)}
  .vfacade::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35))}
  .vfacade .vplay{z-index:1}
  .video-cap{text-align:center;font-size:14.5px;color:var(--faint);margin:0 0 12px;font-weight:700}
  .video-cap a{color:var(--blue)}

  /* blocos de benefício: título curto em negrito + uma linha de explicação,
     para o olho pegar a ideia sem precisar ler o parágrafo inteiro */
  .benef{list-style:none;padding:0;margin:8px 0 12px}
  .benef li{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);
    border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-bottom:7px;text-align:left}
  .benef .bi{font-size:17px;line-height:1.2;flex-shrink:0}
  .benef b{display:block;font-size:15.5px;color:var(--ink);font-weight:900;margin-bottom:1px}
  .benef small{display:block;font-size:14px;color:var(--ink-soft);font-weight:600;line-height:1.38}

  /* bloco de desejo, no fim do diagnóstico */
  .desejo{background:linear-gradient(160deg,rgba(7,176,237,.07),rgba(233,65,53,.07));

  .dj-p{margin:0 0 9px;font-size:15px;line-height:1.5;color:var(--ink-soft);font-weight:600}
  .dj-p b{color:var(--ink);font-weight:800}
  .dj-f{margin:0;color:var(--coral-d);font-weight:800}
  .dj-f b{color:var(--coral-d)}

  /* mecanismo em 3 movimentos, na tela da oferta */
  .mec-t{text-align:center;font-size:13px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);font-weight:800;margin:0 0 10px}
  .mec{list-style:none;padding:0;margin:0 0 16px;counter-reset:m}

  .mec li:not(:last-child)::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;

  .mec .mn{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--coral);color:#fff;
    font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;z-index:1}
  .mec b{display:block;font-size:15px;color:var(--ink);font-weight:900;margin-bottom:1px}
  .mec small{display:block;font-size:14.5px;color:var(--ink-soft);font-weight:600;line-height:1.4}
  .prod-sub{text-align:center;font-size:15px;color:var(--ink-soft);font-weight:700;line-height:1.45;margin:0 0 12px}

  function abrirLightbox(src,alt){
    var box=document.createElement("div");

      '<img src="'+esc(src)+'" alt="'+esc(alt)+'">';
    function fechar(){ if(box.parentNode) box.parentNode.removeChild(box);
      document.removeEventListener("keydown",aoTeclar); }
    function aoTeclar(e){ if(e.key==="Escape") fechar(); }
    box.addEventListener("click",fechar);
    document.addEventListener("keydown",aoTeclar);
    document.body.appendChild(box);

  function initCarrossel(){
    var track=document.getElementById("carTrack"); if(!track) return;
    var wrap=track.parentNode;

    [].slice.call(track.querySelectorAll(".car-print")).forEach(function(pr){
      pr.addEventListener("click",function(e){
        e.stopPropagation();
        var im=pr.querySelector("img"); if(!im) return;
        abrirLightbox(im.getAttribute("src"), im.getAttribute("alt")||"");
      });
    });

    // print que não carrega dá lugar ao depoimento em texto
    [].slice.call(track.querySelectorAll(".car-print img")).forEach(function(im){
      function fail(){
        var item=im.closest(".car-item"); if(!item) return;
        var pr=item.querySelector(".car-print"), tx=item.querySelector(".testi");
        if(pr) pr.style.display="none";
        var cap=item.querySelector(".car-cap"), hint=item.querySelector(".car-hint");
        if(hint) hint.style.display="none";
        if(tx){ tx.style.display=""; if(cap) cap.style.display="none"; }
        else item.style.display="none";
      }
      im.addEventListener("error", fail);
      if(im.complete && im.naturalWidth===0) fail();
    });

    var dots=[].slice.call(wrap.querySelectorAll(".car-dot"));
    var arrows=[].slice.call(wrap.querySelectorAll(".car-arrow"));
    if(!dots.length) return;
    var n=track.children.length;
    function step(){ return track.clientWidth+10; }           // largura do slide + gap
    function atual(){ return Math.max(0,Math.min(n-1,Math.round(track.scrollLeft/step()))); }
    function sync(){
      var i=atual();
      dots.forEach(function(dt,k){ dt.classList.toggle("on",k===i); });
      arrows.forEach(function(a){
        var dir=parseInt(a.getAttribute("data-car"),10);
        a.disabled = (dir<0 && i===0) || (dir>0 && i===n-1);
      });
    }
    function irPara(i){
      i=Math.max(0,Math.min(n-1,i));
      track.scrollTo({left:i*step(), behavior:"smooth"});
    }
    var t=null;
    track.addEventListener("scroll",function(){
      if(t) clearTimeout(t);
      t=setTimeout(sync,80);
    },{passive:true});
    dots.forEach(function(dt){ dt.addEventListener("click",function(e){
      e.stopPropagation(); irPara(parseInt(dt.getAttribute("data-dot"),10)); }); });
    arrows.forEach(function(a){ a.addEventListener("click",function(e){
      e.stopPropagation(); irPara(atual()+parseInt(a.getAttribute("data-car"),10)); }); });
    window.addEventListener("resize",sync,{passive:true});
    sync();
  }

  var clockTimer=null;
  function startClock(){
    var end=Date.now()+15*60*1000;
    var el=document.getElementById("clock");
    if(clockTimer)clearInterval(clockTimer);
    clockTimer=setInterval(function(){
      if(!document.getElementById("clock")){clearInterval(clockTimer);return;}
      var left=Math.max(0,Math.floor((end-Date.now())/1000));
      var m=Math.floor(left/60), s=left%60;
      el.textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
      if(left<=0)clearInterval(clockTimer);
    },1000);
  }
